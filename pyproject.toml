[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yaqd_xeryon"
authors = [
  {name = "Dan Kohler"},
]
description = "yaq daemons for xeryon controllers"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
  "yaqd-core>=2020.06.3",
  "pyserial",
]
dynamic = ["version"]
license="LGPL-3.0-only"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
]

[project.urls]
"Home Page" = "https://yaq.fyi"
Source = "https://github.com/yaq-project/yaqd_xeryon"
Issues = "https://github.com/yaq-project/yaqd_xeryon/issues"

[project.optional-dependencies]
dev = ["black", "pre-commit"]

[project.scripts]
yaqd-xeryon-xls = "yaqd_xeryon._xeryon_xls:XeryonXLS.main"


[tool.black]
line-length = 99
target-version = ['py312', 'py313', 'py314', 'py315']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.hatch.version]
path = "yaqd_xeryon/__version__.py"
